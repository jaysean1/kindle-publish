<!DOCTYPE html>
<!-- ==================================================================
     LONG DOCUMENT TEMPLATE · parchment design system
     多页 A4 白皮书/技术报告/年度总结
     结构：封面 -> 目录 -> 执行摘要 -> 正文章节 -> 附录
     ================================================================== -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Kami">
<style>
  /* Regular weight */
  @font-face {
    font-family: "TsangerJinKai02";
    src: url("../fonts/TsangerJinKai02-W04.ttf") format("truetype"),
       url("https://cdn.jsdelivr.net/gh/tw93/Kami@main/assets/fonts/TsangerJinKai02-W04.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }

  /* Bold weight - W05 for all bold variants */
  @font-face {
    font-family: "TsangerJinKai02";
    src: url("../fonts/TsangerJinKai02-W05.ttf") format("truetype"),
       url("https://cdn.jsdelivr.net/gh/tw93/Kami@main/assets/fonts/TsangerJinKai02-W05.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }

  @page {
    size: 91mm 122mm;
    margin: 6mm 6mm 7mm 6mm;

    @top-right {
      content: string(section-title);
      font-family: "TsangerJinKai02", "Source Han Serif SC",
                   "Noto Serif CJK SC", "Songti SC", Georgia, serif;
      font-size: 5.5pt;
      color: #6b6a64;
    }

    @bottom-center {
      content: counter(page) "  ·  {{DOC_TITLE}}";
      font-family: "TsangerJinKai02", "Source Han Serif SC",
                   "Noto Serif CJK SC", "Songti SC", Georgia, serif;
      font-size: 6pt;
      color: #6b6a64;
    }
  }

  @page:first {
    @top-right { content: ""; }
    @bottom-center { content: ""; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment: transparent;
    --ivory:     transparent;
    --near-black:#141413;
    --dark-warm: #3d3d3a;
    --olive:     #504e49;
    --stone:     #6b6a64;
    --brand:     #1B365D;
    --border:    #e8e6dc;
    --border-soft:#e5e3d8;
    --tag-bg:    transparent;
    --serif: "TsangerJinKai02", "Source Han Serif SC", "Source Han Serif CN", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --sans: var(--serif);

    --rhythm-module:  8.7pt;
    --rhythm-section: 11.2pt;
  }

  html, body { background: none; }

  @media screen {
    body { max-width: 210mm; margin: 0 auto; padding: 20mm 22mm 22mm 22mm; }
  }

  body {
    color: var(--near-black);
    font-family: var(--serif);
    font-size: 8.5pt;
    line-height: 1.6;
    letter-spacing: 0.2pt;
    widows: 3;
    orphans: 3;
  }

  .sans {
    font-family: var(--sans);
  }

  /* ========== COVER ========== */
  .cover {
    min-height: 240mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40mm 0 0 0;
    break-after: page;
  }
  .cover-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 5.0pt;
    font-family: var(--sans);
    font-size: 6.2pt;
    color: var(--brand);
    letter-spacing: 0.2pt;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 11.2pt;
  }
  .cover-eyebrow::before {
    content: "";
    width: 5.6pt;
    height: 5pt;
    border-radius: 5pt;
    background: var(--brand);
    flex-shrink: 0;
  }
  .cover-title {
    font-size: 22.3pt;
    font-weight: 500;
    color: var(--near-black);
    line-height: 1.15;
    letter-spacing: 0.2pt;
    margin-bottom: 9.9pt;
  }
  .cover-sub {
    font-family: var(--sans);
    font-size: 8.7pt;
    color: var(--olive);
    line-height: 1.5;
    max-width: 85%;
    margin-bottom: 18.6pt;
  }
  .cover-meta {
    font-family: var(--sans);
    font-size: 6.2pt;
    color: var(--stone);
    line-height: 1.5;
  }
  .cover-meta strong {
    color: var(--dark-warm);
    font-weight: 500;
  }

  /* ========== TOC（目录）========== */
  .toc { break-after: page; }
  .toc h2 {
    font-size: 13.6pt;
    font-weight: 500;
    margin-bottom: var(--rhythm-module);
    border-left: 2pt solid var(--brand);
    border-radius: 1.5pt;
    padding-left: 5.0pt;
  }
  .toc-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6pt 0;
    border-bottom: 0.5pt dotted #c9c7bd;
    font-size: 8pt;
  }
  .toc-item:last-of-type { border-bottom: none; }
  .toc-num {
    color: var(--brand);
    font-weight: 500;
    min-width: 18.6pt;
  }
  .toc-title {
    flex: 1;
    color: var(--near-black);
    padding-left: 6pt;
    text-decoration: none;
    display: flex;
    justify-content: space-between;
    gap: 7.4pt;
  }
  .toc-title[href]::after {
    content: target-counter(attr(href), page);
    color: var(--stone);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  /* ========== HEADINGS ========== */
  h1 {
    font-size: 13.6pt;
    font-weight: 500;
    line-height: 1.2;
    margin: 0 0 6.2pt 0;
    border-left: 2pt solid var(--brand);
    border-radius: 1.5pt;
    padding-left: 5.0pt;
    color: var(--near-black);
    break-after: avoid;
    string-set: section-title content();
  }

  .running-title { string-set: section-title content(); }

  h2 {
    font-size: 9.9pt;
    font-weight: 500;
    line-height: 1.25;
    margin: 14.9pt 0 5.0pt 0;
    color: var(--near-black);
    break-after: avoid;
  }

  h3 {
    font-size: 8.1pt;
    font-weight: 500;
    line-height: 1.3;
    margin: 11.2pt 0 6pt 0;
    color: var(--dark-warm);
    break-after: avoid;
  }

  .chapter-num {
    font-family: var(--sans);
    font-size: 6.2pt;
    color: var(--brand);
    letter-spacing: 0.2pt;
    text-transform: uppercase;
    margin-bottom: 6pt;
  }

  /* ========== PARAGRAPHS ========== */
  p {
    margin: 0 0 6.2pt 0;
    line-height: 1.55;
    color: var(--near-black);
    widows: 2;
    orphans: 2;
  }

  .lead {
    font-size: 7.4pt;
    line-height: 1.55;
    color: var(--dark-warm);
    margin-bottom: var(--rhythm-module);
  }

  .hl { color: var(--brand); font-weight: 500; }
  strong { font-weight: 500; }

  /* ========== LISTS ========== */
  ul, ol {
    margin: 6pt 0 6.2pt 0;
    padding-left: 12.4pt;
    line-height: 1.55;
  }
  ul li::marker { color: var(--brand); }
  ol li::marker { color: var(--brand); font-weight: 500; }

  /* ========== QUOTE ========== */
  blockquote, .quote {
    border-left: 1.2pt solid var(--brand);
    margin: 7.4pt 0;
    padding: 5pt 0 5pt 9.9pt;
    color: var(--olive);
    line-height: 1.55;
    break-inside: avoid;
  }
  blockquote .cite, .quote .cite {
    display: block;
    font-size: 5.6pt;
    color: var(--stone);
    margin-top: 5pt;
  }

  /* ========== CODE ========== */
  /* Mono first for English glyphs, then CJK fallback so Chinese comments
     inside code/pre render correctly. A mono-only chain causes missing
     glyphs rendered as "?" or missing-glyph boxes in WeasyPrint when the system lacks
     a mono font with CJK coverage. */
  code {
    font-family: "JetBrains Mono", "SF Mono", Consolas,
                 "TsangerJinKai02", "Source Han Serif SC",
                 "Noto Serif CJK SC", "Songti SC", monospace;
    font-size: 5.6pt;
    background: var(--ivory);
    padding: 5pt 5pt;
    border-radius: 5pt;
    color: var(--dark-warm);
  }
  pre {
    font-family: "JetBrains Mono", "SF Mono", Consolas,
                 "TsangerJinKai02", "Source Han Serif SC",
                 "Noto Serif CJK SC", "Songti SC", monospace;
    font-size: 5.6pt;
    line-height: 1.5;
    background: var(--ivory);
    border-radius: 5pt;
    padding: 6.2pt 8.7pt;
    margin: 6.2pt 0;
    white-space: pre-wrap;
    color: var(--near-black);
    break-inside: avoid;
  }
  pre code { background: transparent; padding: 0; font-size: inherit; }

  /* ========== TABLE (kami-table) ========== */
  table, .kami-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 5.9pt;
    margin: 7.4pt 0;
    break-inside: avoid;
  }
  table th, .kami-table th {
    text-align: left;
    font-weight: 500;
    color: var(--dark-warm);
    padding: 4pt 5.0pt;
    border-bottom: 0.7pt solid var(--border);
    background: transparent;
  }
  table td, .kami-table td {
    padding: 4pt 5.0pt;
    border-bottom: 0.5pt solid var(--border-soft);
    vertical-align: top;
  }
  table.compact th, .kami-table.compact th { padding: 5pt 6pt; font-size: 5.0pt; }
  table.compact td, .kami-table.compact td { padding: 5pt 6pt; font-size: 5.0pt; line-height: 1.4; }
  table.financial td:not(:first-child), .kami-table.financial td:not(:first-child) {
    text-align: right; font-variant-numeric: tabular-nums;
  }
  table.financial th:not(:first-child), .kami-table.financial th:not(:first-child) { text-align: right; }
  table.striped tbody tr:nth-child(even) td, .kami-table.striped tbody tr:nth-child(even) td {
    background: var(--ivory);
  }
  table .total td, .kami-table .total td {
    font-weight: 500; border-top: 1pt solid var(--brand); border-bottom: none; color: var(--near-black);
  }

  /* ========== CALLOUT ========== */
  .callout {
    background: var(--ivory);
    border-left: 1.2pt solid var(--brand);
    padding: 6.2pt 8.7pt;
    border-radius: 5pt;
    margin: 7.4pt 0;
    line-height: 1.55;
    break-inside: avoid;
  }
  .callout blockquote,
  .callout .quote {
    border-left: none;
    padding-left: 0;
    margin: 6pt 0;
    color: var(--olive);
  }
  .callout blockquote:first-child,
  .callout .quote:first-child { margin-top: 0; }
  .callout blockquote:last-child,
  .callout .quote:last-child  { margin-bottom: 0; }

  .takeaway {
    background: var(--ivory);
    border-radius: 5pt;
    padding: 6.2pt 8.7pt;
    margin: 8.7pt 0;
    break-inside: avoid;
  }
  .takeaway-label {
    font-family: var(--sans);
    font-size: 5.6pt;
    color: var(--brand);
    letter-spacing: 0.2pt;
    text-transform: uppercase;
    margin-bottom: 5pt;
  }

  /* ========== TAG ========== */
  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--brand);
    font-family: var(--sans);
    font-size: 5.6pt;
    font-weight: 500;
    padding: 5pt 6pt;
    border-radius: 5pt;
    margin-right: 5pt;
  }

  /* ========== FIGURE ========== */
  figure {
    margin: 8.7pt 0;
    break-inside: avoid;
  }
  figure img {
    max-width: 100%;
    border-radius: 5pt;
  }
  /* Inline diagrams (e.g. a Mermaid-sourced SVG via scripts/mermaid_normalize.py):
     center and cap width so the figure never bleeds past the text column. */
  figure svg {
    display: block;
    margin: 0 auto;
    max-width: 78%;
    height: auto;
  }
  figcaption {
    font-family: var(--sans);
    font-size: 5.6pt;
    color: var(--stone);
    margin-top: 6pt;
    text-align: center;
  }

  /* ========== EXECUTIVE SUMMARY ========== */
  .exec-summary {
    background: var(--ivory);
    border-left: 1.2pt solid var(--brand);
    border-radius: 6pt;
    padding: 9.9pt 12.4pt;
    margin: 8.7pt 0;
    break-inside: avoid;
  }
  .exec-summary h2 {
    margin-top: 0;
    font-size: 8.1pt;
  }

  /* ========== CHAPTER BREAK ========== */
  .chapter { break-before: page; }
</style>
</head>
<body>

<!-- COVER: full-bleed generated image -->
<section style="break-after: page; margin: -6mm -6mm 0 -6mm;">
  <img src="{{COVER_PNG}}" alt="封面" style="width: 100%; height: 122mm; object-fit: cover; display: block;">
</section>

<!-- TOC: one .toc-item per chapter -->
<section class="toc">
  <h2>目录</h2>
  <div class="toc-item"><span class="toc-num">01</span><a class="toc-title" href="#ch-1">{{章标题}}</a></div>
</section>

<!-- CHAPTER: repeat per section -->
<section class="chapter" id="ch-1">
  <div class="chapter-num">01 · {{ENGLISH_TAG}}</div>
  <h1>{{章标题}}</h1>
  <p class="lead">{{章节导语，1-2 句}}</p>
  <h2>{{小节标题}}</h2>
  <p>{{正文。关键数据用 <span class="hl">强调</span>。}}</p>
  <figure>
    {{内联 SVG，白底无填充，线条 #1B365D / #504e49}}
    <figcaption>图 N：{{一句话说明图的读法}}</figcaption>
  </figure>
</section>

</body>
</html>
